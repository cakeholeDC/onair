name: macOS Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/static-analysis.yaml

  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/unit-test.yaml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release scripts
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Detect version change
        if: github.event_name != 'workflow_dispatch'
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: bash .github/scripts/release-version.sh "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  propose:
    name: Update release PR
    needs: [lint, test, version]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true

  build:
    name: Build macOS (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Build and smoke-test release archive
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          test "$(go env GOARCH)" = "$ARCH"
          mkdir -p dist bundle smoke
          go build -ldflags=-linkmode=external -o bundle/onair .
          xcrun vtool -show-build bundle/onair | awk '$1 == "minos" && $2 ~ /^12\.0(\.0)?$/ { found = 1 } END { exit !found }'
          cp LICENSE bundle/
          archive="dist/onair-${TAG}-darwin-${ARCH}.tar.gz"
          tar -czf "$archive" -C bundle onair LICENSE
          tar -xzf "$archive" -C smoke
          smoke/onair --help
      - uses: actions/upload-artifact@v4
        with:
          name: onair-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [lint, test, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: onair-release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: onair-darwin-*
          path: dist
          merge-multiple: true
      - name: Look for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          release_id=$(bash .github/scripts/publish-release.sh "$TAG" --lookup)
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
      - name: Create draft with Release Please
        if: steps.existing.outputs.id == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: bash .github/scripts/publish-release.sh "$TAG" "$GITHUB_SHA" dist
